name: Build furnace

on:
  push:
    branches: [ android-actions ]
  pull_request:
    branches: [ android-actions ]

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        config:
          - { name: 'Android', os: ubuntu-22.04, arch: x86_64 }
          #- { name: 'Linux ARM', os: ubuntu-18.04, arch: armhf }
      fail-fast: true

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.0
      with:
        submodules: recursive
        
    - name: Set package identifier
      id: package-identify
      run: |
        package_name="furnace-${GITHUB_SHA}-Android"
        package_ext=".tar.gz"

        echo "Package identifier: ${package_name}"
        echo "Package file: ${package_name}${package_ext}"

        echo "id=${package_name}" >> $GITHUB_OUTPUT
        echo "filename=${package_name}${package_ext}" >> $GITHUB_OUTPUT

    - name: Set build cores amount
      id: build-cores
      run: |
        # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
        amount=2

        echo "Amount of cores we can build with: ${amount}"

        echo "amount=${amount}" >> $GITHUB_OUTPUT

    - name: Install Dependencies [Linux x86_64 / Android]
      run: |
        sudo apt update
        sudo apt install \
          libsdl2-dev \
          libfmt-dev \
          librtmidi-dev \
          libsndfile1-dev \
          zlib1g-dev \
          libjack-jackd2-dev \
          gettext

    - name: Build Language Files
      if: ${{ runner.os == 'Linux' && matrix.config.compiler != 'mingw' }}
      run: |
        ./scripts/build-po.sh

    - name: Configure
      run: |
        export USE_WAE=OFF
        export CMAKE_EXTRA_ARGS=()
        
        echo "EXTRA FLAGS: ${CMAKE_EXTRA_ARGS[@]}"

        cmake \
          -B ${PWD}/build \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DWARNINGS_ARE_ERRORS=${USE_WAE} \
          -DWITH_DEMOS=OFF -DWITH_INSTRUMENTS=OFF -DWITH_WAVETABLES=OFF \
          "${CMAKE_EXTRA_ARGS[@]}"
    
    - name: Build [Android]
      if: ${{ matrix.config.name == 'Android' }}
      run: |
        cd ${PWD}/android/
        JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64/ ./gradlew assembleRelease
        JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64/ ./gradlew --stop
        cd ../..

    - name: Package
      if: ${{ matrix.config.name == 'Android' }}
      run: |

        mkdir -p target/furnace
        mv ${PWD}/android/app/build/outputs/apk/debug/app-release.apk ${PWD}/android/app/build/outputs/apk/debug/app-release-unsigned.apk target/furnace/${{ steps.package-identify.outputs.id }}.apk
        pushd target/furnace

        cp ../../LICENSE .
        cp ../../res/releaseReadme/unstable-android.txt .
        cp -r ../../papers papers
        cp -r ../../demos demos
        cp -r ../../instruments instruments
        cp -r ../../wavetables wavetables

        popd

        cd target
        tar -zcv -f ../${{ steps.package-identify.outputs.filename }} furnace


    - name: Upload artifact
      if: ${{ github.repository == 'andrejkuroglo8/furnace' && github.ref_name == 'android-actions' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package-identify.outputs.id }}
        path: ${{ steps.package-identify.outputs.filename }}
